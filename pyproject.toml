[project]
name = "cephkit"
# uv requires a version here; cephkit's own comes from its git tag at release.
version = "0.0.0"
description = "A command-line toolkit for operating Ceph clusters"
license = "MIT"
requires-python = ">=3.10"

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.uv]
package = false

[tool.ruff]
# The checkout's entry script has no .py suffix, so ruff would skip it.
extend-include = ["bin/cephkit"]
